# ==========================================
# UrbanGuardian AI - API Gateway
# ==========================================

spring.application.name=api-gateway

# Gateway port
server.port=8080

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register this gateway with Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Prefer IP address for local development
eureka.instance.prefer-ip-address=true


# Complaint Service Route
# ==========================================
spring.cloud.gateway.server.webmvc.routes[0].id=complaint-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://COMPLAINT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/complaints/**
# ==========================================
# AI Analysis Service Route
# ==========================================
spring.cloud.gateway.server.webmvc.routes[1].id=ai-analysis-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AI-ANALYSIS-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/ai/**